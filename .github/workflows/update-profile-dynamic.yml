name: Update dynamic profile sections

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate profile activity token
        env:
          PROFILE_ACTIVITY_TOKEN: ${{ secrets.PROFILE_ACTIVITY_TOKEN }}
        run: |
          if [ -z "${PROFILE_ACTIVITY_TOKEN}" ]; then
            echo "PROFILE_ACTIVITY_TOKEN no está configurado." >&2
            exit 1
          fi

      - name: Update dynamic sections in readme.md
        uses: actions/github-script@v7
        env:
          PROFILE_USERNAME: ${{ vars.PROFILE_USERNAME || github.repository_owner }}
          SHOW_PRIVATE_REPO_NAMES: ${{ vars.SHOW_PRIVATE_REPO_NAMES || 'false' }}
          REQUIRE_PRIVATE_REPO_ACCESS: ${{ vars.REQUIRE_PRIVATE_REPO_ACCESS || 'true' }}
          PRIVATE_REPOS_FALLBACK_LIMIT: ${{ vars.PRIVATE_REPOS_FALLBACK_LIMIT || '20' }}
          PROFILE_ACTIVITY_TOKEN: ${{ secrets.PROFILE_ACTIVITY_TOKEN }}
        with:
          github-token: ${{ secrets.PROFILE_ACTIVITY_TOKEN }}
          script: |
            const fs = require("fs/promises");
            const path = require("path");

            const username = process.env.PROFILE_USERNAME;
            const showPrivateNames = process.env.SHOW_PRIVATE_REPO_NAMES === "true";
            const requirePrivateRepoAccess = process.env.REQUIRE_PRIVATE_REPO_ACCESS !== "false";
            const fallbackPrivateLimit = Math.max(
              1,
              Number.parseInt(process.env.PRIVATE_REPOS_FALLBACK_LIMIT || "20", 10) || 20
            );
            const readmePath = path.join(process.env.GITHUB_WORKSPACE, "readme.md");
            const tokenName = "PROFILE_ACTIVITY_TOKEN";

            if (!process.env.PROFILE_ACTIVITY_TOKEN) {
              core.setFailed(
                `Falta ${tokenName}. Configura un Fine-grained PAT con acceso de lectura a repos privados y GraphQL.`
              );
              return;
            }

            const now = new Date();
            const from = new Date(now);
            from.setFullYear(from.getFullYear() - 1);

            const preflightQuery = `
              query($login: String!, $privateFirst: Int!) {
                viewer {
                  login
                }
                user(login: $login) {
                  login
                  repositories(
                    privacy: PRIVATE
                    first: $privateFirst
                    orderBy: { field: UPDATED_AT, direction: DESC }
                  ) {
                    totalCount
                    nodes {
                      nameWithOwner
                      isPrivate
                      updatedAt
                    }
                  }
                }
              }
            `;

            const preflight = await github.graphql(preflightQuery, {
              login: username,
              privateFirst: fallbackPrivateLimit,
            });

            const viewerLogin = preflight?.viewer?.login;
            const userNode = preflight?.user;
            if (!userNode) {
              core.setFailed(`No se pudo resolver el usuario de perfil: ${username}.`);
              return;
            }

            if (viewerLogin?.toLowerCase() !== username?.toLowerCase()) {
              core.warning(
                `El token pertenece a '${viewerLogin}' y no a '${username}'. Revisa alcance del token y SSO en organizaciones.`
              );
            }

            const privateAccessibleNodes = userNode?.repositories?.nodes || [];
            const privateAccessibleCount = userNode?.repositories?.totalCount || 0;

            if (requirePrivateRepoAccess && privateAccessibleCount === 0) {
              core.setFailed(
                "El token no detecta repos privados accesibles. Revisa permisos del Fine-grained PAT, acceso a repos seleccionados y aprobación SSO de organizaciones."
              );
              return;
            }

            const query = `
              query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  contributionsCollection(from: $from, to: $to) {
                    hasAnyRestrictedContributions
                    totalCommitContributions
                    totalIssueContributions
                    totalPullRequestContributions
                    totalPullRequestReviewContributions
                    commitContributionsByRepository(maxRepositories: 100) {
                      repository { nameWithOwner isPrivate }
                      contributions(first: 1) { totalCount }
                    }
                    issueContributionsByRepository(maxRepositories: 100) {
                      repository { nameWithOwner isPrivate }
                      contributions(first: 1) { totalCount }
                    }
                    pullRequestContributionsByRepository(maxRepositories: 100) {
                      repository { nameWithOwner isPrivate }
                      contributions(first: 1) { totalCount }
                    }
                    pullRequestReviewContributionsByRepository(maxRepositories: 100) {
                      repository { nameWithOwner isPrivate }
                      contributions(first: 1) { totalCount }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              login: username,
              from: from.toISOString(),
              to: now.toISOString(),
            });

            const collection = result?.user?.contributionsCollection;
            if (!collection) {
              core.setFailed("No se pudo obtener la colección de contribuciones.");
              return;
            }

            const repoMap = new Map();
            const addContributions = (items) => {
              for (const item of items || []) {
                const repo = item?.repository;
                if (!repo) continue;
                const name = repo.nameWithOwner;
                const existing = repoMap.get(name) || {
                  name,
                  isPrivate: Boolean(repo.isPrivate),
                  contributions: 0,
                };
                existing.contributions += item?.contributions?.totalCount || 0;
                repoMap.set(name, existing);
              }
            };

            addContributions(collection.commitContributionsByRepository);
            addContributions(collection.issueContributionsByRepository);
            addContributions(collection.pullRequestContributionsByRepository);
            addContributions(collection.pullRequestReviewContributionsByRepository);

            const reposWithContributions = [...repoMap.values()]
              .filter((repo) => repo.contributions > 0)
              .sort((a, b) => b.contributions - a.contributions);

            const maxReposPerTable = 20;
            const publicRepos = reposWithContributions
              .filter((repo) => !repo.isPrivate)
              .slice(0, maxReposPerTable);
            const privateReposWithContributions = reposWithContributions
              .filter((repo) => repo.isPrivate)
              .slice(0, maxReposPerTable);

            const totalPublicRepos = reposWithContributions.filter((repo) => !repo.isPrivate).length;
            const totalPrivateRepos = reposWithContributions.filter((repo) => repo.isPrivate).length;
            const totalContributions =
              (collection.totalCommitContributions || 0) +
              (collection.totalIssueContributions || 0) +
              (collection.totalPullRequestContributions || 0) +
              (collection.totalPullRequestReviewContributions || 0);
            const privateContribRepoNames = new Set(
              reposWithContributions.filter((repo) => repo.isPrivate).map((repo) => repo.name)
            );
            const partialPrivateRepos = privateAccessibleNodes
              .filter((repo) => repo?.isPrivate && !privateContribRepoNames.has(repo.nameWithOwner))
              .slice(0, fallbackPrivateLimit);
            const privateRepos = [
              ...privateReposWithContributions,
              ...partialPrivateRepos
                .slice(0, Math.max(0, maxReposPerTable - privateReposWithContributions.length))
                .map((repo) => ({
                  name: repo.nameWithOwner,
                  isPrivate: true,
                  contributions: 0,
                  contributionsLabel: "Actividad parcial",
                })),
            ];

            const fmtDate = (date) =>
              date.toLocaleDateString("es-CL", {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
              });

            const summaryLines = [
              `- **Periodo analizado:** ${fmtDate(from)} → ${fmtDate(now)}`,
              `- **Contribuciones totales:** ${totalContributions}`,
              `- **Repositorios con actividad detectada:** ${reposWithContributions.length} (${totalPublicRepos} públicos, ${totalPrivateRepos} privados)`,
              `- **Repos privados accesibles por token:** ${privateAccessibleCount}`,
            ];

            let privateAliasIndex = 1;
            const escapeHtml = (value) =>
              value
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
            const renderRepoTable = (repos, isPrivateSection = false) => {
              const lines = [
                "<table>",
                "  <thead>",
                "    <tr><th>Repositorio</th><th>Aportes (12 meses)</th></tr>",
                "  </thead>",
                "  <tbody>",
              ];

              if (repos.length === 0) {
                lines.push("    <tr><td>Sin actividad detectada en el periodo</td><td>-</td></tr>");
              } else {
                for (const repo of repos) {
                  const repositoryName =
                    isPrivateSection && !showPrivateNames
                      ? `Repositorio privado #${privateAliasIndex++}`
                      : repo.name;
                  lines.push(
                    `    <tr><td>${escapeHtml(repositoryName)}</td><td>${repo.contributionsLabel || repo.contributions}</td></tr>`
                  );
                }
              }

              lines.push("  </tbody>");
              lines.push("</table>");
              return lines;
            };

            const tableLines = [
              "<table>",
              "  <tr>",
              "    <td valign=\"top\" width=\"50%\">",
              "      <strong>🌍 Repos públicos</strong><br><br>",
              ...renderRepoTable(publicRepos).map((line) => `      ${line}`),
              "    </td>",
              "    <td valign=\"top\" width=\"50%\">",
              "      <strong>🔒 Repos privados</strong><br><br>",
              ...renderRepoTable(privateRepos, true).map((line) => `      ${line}`),
              "    </td>",
              "  </tr>",
              "</table>",
            ];

            const privateMissingFromContrib = Math.max(
              0,
              privateAccessibleCount - privateContribRepoNames.size
            );
            core.info(
              `[diagnostics] token=${tokenName}; viewer=${viewerLogin}; profile=${username}; private_accessible=${privateAccessibleCount}; private_in_contributions=${privateContribRepoNames.size}; private_partial_listed=${partialPrivateRepos.length}; private_missing_from_contributions=${privateMissingFromContrib}; restricted_contributions=${collection.hasAnyRestrictedContributions ? "true" : "false"}`
            );
            core.notice(
              "Verifica en tu cuenta GitHub la opción 'Include private contributions on my profile' y, si aplica, aprobación SSO del token en organizaciones."
            );

            const replaceSection = (content, marker, body) => {
              const start = `<!-- DYNAMIC:${marker}:START -->`;
              const end = `<!-- DYNAMIC:${marker}:END -->`;
              const escapeRegExp = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const regex = new RegExp(`${escapeRegExp(start)}[\\s\\S]*?${escapeRegExp(end)}`, "m");
              return content.replace(regex, `${start}\n${body}\n${end}`);
            };

            const original = await fs.readFile(readmePath, "utf8");
            const updatedSummary = replaceSection(original, "ACTIVITY_SUMMARY", summaryLines.join("\n"));
            const updatedReadme = replaceSection(updatedSummary, "RECENT_PROJECTS", tableLines.join("\n"));

            if (updatedReadme === original) {
              core.info("No changes detected in readme.md.");
              return;
            }

            await fs.writeFile(readmePath, updatedReadme, "utf8");
            core.info("readme.md updated successfully.");

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update dynamic profile sections"
          file_pattern: readme.md
