name: Update dynamic profile sections

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update dynamic sections in readme.md
        uses: actions/github-script@v7
        env:
          PROFILE_USERNAME: ${{ vars.PROFILE_USERNAME || github.repository_owner }}
          SHOW_PRIVATE_REPO_NAMES: ${{ vars.SHOW_PRIVATE_REPO_NAMES || 'false' }}
          PROFILE_ACTIVITY_TOKEN: ${{ secrets.PROFILE_ACTIVITY_TOKEN }}
        with:
          github-token: ${{ secrets.PROFILE_ACTIVITY_TOKEN != '' && secrets.PROFILE_ACTIVITY_TOKEN || github.token }}
          script: |
            const fs = require("fs/promises");
            const path = require("path");

            const username = process.env.PROFILE_USERNAME;
            const showPrivateNames = process.env.SHOW_PRIVATE_REPO_NAMES === "true";
            const usingPersonalToken = Boolean(process.env.PROFILE_ACTIVITY_TOKEN);
            const readmePath = path.join(process.env.GITHUB_WORKSPACE, "readme.md");

            const now = new Date();
            const from = new Date(now);
            from.setFullYear(from.getFullYear() - 1);

            const query = `
              query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  contributionsCollection(from: $from, to: $to) {
                    totalCommitContributions
                    totalIssueContributions
                    totalPullRequestContributions
                    totalPullRequestReviewContributions
                    commitContributionsByRepository(maxRepositories: 100) {
                      repository { nameWithOwner isPrivate }
                      contributions(first: 1) { totalCount }
                    }
                    issueContributionsByRepository(maxRepositories: 100) {
                      repository { nameWithOwner isPrivate }
                      contributions(first: 1) { totalCount }
                    }
                    pullRequestContributionsByRepository(maxRepositories: 100) {
                      repository { nameWithOwner isPrivate }
                      contributions(first: 1) { totalCount }
                    }
                    pullRequestReviewContributionsByRepository(maxRepositories: 100) {
                      repository { nameWithOwner isPrivate }
                      contributions(first: 1) { totalCount }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              login: username,
              from: from.toISOString(),
              to: now.toISOString(),
            });

            const collection = result?.user?.contributionsCollection;
            if (!collection) {
              core.setFailed("No se pudo obtener la colección de contribuciones.");
              return;
            }

            const repoMap = new Map();
            const addContributions = (items) => {
              for (const item of items || []) {
                const repo = item?.repository;
                if (!repo) continue;
                const name = repo.nameWithOwner;
                const existing = repoMap.get(name) || {
                  name,
                  isPrivate: Boolean(repo.isPrivate),
                  contributions: 0,
                };
                existing.contributions += item?.contributions?.totalCount || 0;
                repoMap.set(name, existing);
              }
            };

            addContributions(collection.commitContributionsByRepository);
            addContributions(collection.issueContributionsByRepository);
            addContributions(collection.pullRequestContributionsByRepository);
            addContributions(collection.pullRequestReviewContributionsByRepository);

            const repos = [...repoMap.values()]
              .filter((repo) => repo.contributions > 0)
              .sort((a, b) => b.contributions - a.contributions)
              .slice(0, 20);

            const totalPublicRepos = repos.filter((repo) => !repo.isPrivate).length;
            const totalPrivateRepos = repos.filter((repo) => repo.isPrivate).length;
            const totalContributions =
              (collection.totalCommitContributions || 0) +
              (collection.totalIssueContributions || 0) +
              (collection.totalPullRequestContributions || 0) +
              (collection.totalPullRequestReviewContributions || 0);

            const fmtDate = (date) =>
              date.toLocaleDateString("es-CL", {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
              });

            const summaryLines = [
              `- **Periodo analizado:** ${fmtDate(from)} → ${fmtDate(now)}`,
              `- **Contribuciones totales:** ${totalContributions}`,
              `- **Repositorios con actividad detectada:** ${repos.length} (${totalPublicRepos} públicos, ${totalPrivateRepos} privados)`,
              usingPersonalToken
                ? `- **Fuente:** token personal (incluye actividad privada según permisos del token)`
                : `- **Fuente:** GITHUB_TOKEN (actividad pública; para incluir privados agrega \`PROFILE_ACTIVITY_TOKEN\`)`,
            ];

            let privateAliasIndex = 1;
            const tableLines = [
              "| Repositorio | Tipo | Aportes (12 meses) |",
              "| --- | --- | --- |",
            ];

            if (repos.length === 0) {
              tableLines.push("| Sin actividad detectada en el periodo | - | - |");
            } else {
              for (const repo of repos) {
                const repositoryName = repo.isPrivate && !showPrivateNames
                  ? `Repositorio privado #${privateAliasIndex++}`
                  : repo.name;
                const safeName = repositoryName.replaceAll("|", "\\|");
                tableLines.push(
                  `| ${safeName} | ${repo.isPrivate ? "Privado" : "Público"} | ${repo.contributions} |`
                );
              }
            }

            const replaceSection = (content, marker, body) => {
              const start = `<!-- DYNAMIC:${marker}:START -->`;
              const end = `<!-- DYNAMIC:${marker}:END -->`;
              const escapeRegExp = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const regex = new RegExp(`${escapeRegExp(start)}[\\s\\S]*?${escapeRegExp(end)}`, "m");
              return content.replace(regex, `${start}\n${body}\n${end}`);
            };

            const original = await fs.readFile(readmePath, "utf8");
            const updatedSummary = replaceSection(original, "ACTIVITY_SUMMARY", summaryLines.join("\n"));
            const updatedReadme = replaceSection(updatedSummary, "RECENT_PROJECTS", tableLines.join("\n"));

            if (updatedReadme === original) {
              core.info("No changes detected in readme.md.");
              return;
            }

            await fs.writeFile(readmePath, updatedReadme, "utf8");
            core.info("readme.md updated successfully.");

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update dynamic profile sections"
          file_pattern: readme.md
